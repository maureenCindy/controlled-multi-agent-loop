# TP-048: the app connects to a real PostgreSQL instance (started via ../docker-compose.yml)
# instead of the old H2 in-memory database, so subscriber/tender data survives restarts.
#
# Defaults below match tenderpulse/docker-compose.yml's local-dev Postgres service; override any
# of them with the corresponding env var (e.g. for a non-Docker Postgres, or later deployment).
#
# The test suite deliberately keeps using H2 in-memory (see
# apps/api/src/test/resources/application.yml) rather than this datasource — see
# apps/api/README.md "Tests vs. the real datasource" for why.
spring:
  application:
    name: tenderpulse
  # TP-038 (Reviewer follow-up): "dev" by default so `./gradlew bootRun` keeps working with zero
  # config, same as before. A real deployment should set SPRING_PROFILES_ACTIVE to something
  # other than dev/test — com.tenderpulse.auth.InsecureDefaultSecretGuard refuses to start on the
  # checked-in default tenderpulse.auth.token-secret unless "dev" or "test" is active.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tenderpulse}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:tenderpulse}
    password: ${DB_PASSWORD:tenderpulse}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  port: 8080

logging:
  level:
    com.tenderpulse: INFO

tenderpulse:
  aggregation:
    scheduled-enabled: false
    scheduled-initial-delay-ms: 0
    scheduled-interval-ms: 10800000  # 3 hours
  # TP-044: shared admin-key secret guarding every /api/v1/admin/** route (see
  # com.tenderpulse.auth.AdminKeyAuthFilter / SecurityConfig) — loaded from an env var only, never
  # committed. No fallback value on purpose: an unset TENDERPULSE_ADMIN_KEY leaves this blank, and
  # AdminKeyAuthFilter always rejects a blank configured key, so the admin API fails closed rather
  # than booting with a guessable/known default.
  admin:
    key: ${TENDERPULSE_ADMIN_KEY:}
  auth:
    # TP-038: HMAC key signing the stateless bearer access token issued after magic-link verify.
    # MUST be overridden (TENDERPULSE_AUTH_SECRET) in any real deployment; the fallback below is
    # only safe for local dev/test — com.tenderpulse.auth.InsecureDefaultSecretGuard logs loudly
    # any time it's in effect, and refuses to start the app entirely unless spring.profiles.active
    # is "dev" or "test" (see the `spring.profiles` block above).
    token-secret: ${TENDERPULSE_AUTH_SECRET:dev-only-insecure-secret-change-me-before-deploying-32b}
    # Magic-link token: single-use, expires 24h after it's issued (see issue #39 assumptions).
    magic-link-ttl-ms: 86400000
    # Bearer access token returned by /verify: also 24h, no refresh flow (out of scope for TP-038).
    access-token-ttl-ms: 86400000
    verify-base-url: ${TENDERPULSE_VERIFY_BASE_URL:http://localhost:8080/api/v1/auth/verify}
  # TP-034: CORS for the marketing site's signup flow (com.tenderpulse.auth.WebsiteCorsConfig).
  # Comma-separated list of allowed origins, e.g. "https://tenderpulse.co,http://localhost:4321"
  # (4321 is Astro's default `npm run dev` port). Empty by default (no origin whitelisted) so
  # cross-origin signup fails closed until this is explicitly configured for a real deployment.
  website:
    allowed-origins: ${WEBSITE_ALLOWED_ORIGINS:}

# TP-042: PayPal Client ID/Secret/Plan ID are credentials — loaded from env vars only, never
# committed. Empty defaults let the app boot without them; POST /api/v1/subscribers/pro will fail
# verification (as PayPalApiException) until they're set. See apps/api/.env.example.
paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  plan-id: ${PAYPAL_PLAN_ID:}
