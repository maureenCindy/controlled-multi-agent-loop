name: Post-Merge /loop Summary

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  post-summary:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract issue number from PR body
        id: extract
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          ISSUE_NUM=$(echo "$PR_BODY" | grep -oP '(?<=Closes\s#)\d+|(?<=Fixes\s#)\d+' | head -1)
          if [ -z "$ISSUE_NUM" ]; then
            echo "No issue link found in PR body"
            exit 0
          fi
          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: Check if TP-* task
        id: check_task
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ $BRANCH =~ ^tp-[0-9]+ ]] || [[ $BRANCH =~ ^fix/tp-[0-9]+ ]]; then
            echo "is_tp_task=true" >> $GITHUB_OUTPUT
          else
            echo "is_tp_task=false" >> $GITHUB_OUTPUT
          fi

      - name: Post /loop summary comment
        if: steps.extract.outputs.issue_number && steps.check_task.outputs.is_tp_task == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = ${{ steps.extract.outputs.issue_number }};
            const prNumber = context.issue.number;
            const branch = context.payload.pull_request.head.ref;
            const prTitle = context.payload.pull_request.title;

            const summaryComment = `## /loop Summary — Task Complete ✅

**PR:** #${prNumber} — ${prTitle}

**Branch:** \`${branch}\`

**Completion:** Builder → Checker PASS → Merged

### Next Steps
1. ✅ PR merged to main
2. ⏳ Template improvement log updated (human review)
3. ⏳ Conditional reviewer (if P0/critical path)
4. ⏳ Human gate: Continue to next task?

For full /loop details and evidence, see the PR.

*Generated by GitHub Actions post-merge workflow*`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: summaryComment
            });

            console.log(`Posted summary to issue #${issue_number}`);
