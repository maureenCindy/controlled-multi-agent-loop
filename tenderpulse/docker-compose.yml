# Local dev infrastructure for TenderPulse (apps/api).
#
# Starts a real PostgreSQL instance so subscriber/tender data survives app restarts (TP-048).
# The running Spring Boot app (apps/api) connects to this via the datasource config in
# apps/api/src/main/resources/application.yml, which defaults to the credentials below.
#
# Usage (from the tenderpulse/ directory):
#   docker compose up -d        # start Postgres in the background
#   docker compose ps           # check it's healthy
#   docker compose down         # stop it (add -v to also wipe the data volume)
#
# See apps/api/README.md for the full local-dev workflow, including why the test suite
# deliberately keeps using H2 in-memory rather than this Postgres instance.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenderpulse
      POSTGRES_USER: tenderpulse
      POSTGRES_PASSWORD: tenderpulse
    ports:
      - "5432:5432"
    volumes:
      - tenderpulse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderpulse -d tenderpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tenderpulse-postgres-data:
