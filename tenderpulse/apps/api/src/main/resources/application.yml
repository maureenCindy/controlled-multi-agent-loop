# TP-048: the app connects to a real PostgreSQL instance (started via ../docker-compose.yml)
# instead of the old H2 in-memory database, so subscriber/tender data survives restarts.
#
# Defaults below match tenderpulse/docker-compose.yml's local-dev Postgres service; override any
# of them with the corresponding env var (e.g. for a non-Docker Postgres, or later deployment).
#
# The test suite deliberately keeps using H2 in-memory (see
# apps/api/src/test/resources/application.yml) rather than this datasource — see
# apps/api/README.md "Tests vs. the real datasource" for why.
spring:
  application:
    name: tenderpulse
  # TP-038 (Reviewer follow-up): "dev" by default so `./gradlew bootRun` keeps working with zero
  # config, same as before. A real deployment should set SPRING_PROFILES_ACTIVE to something
  # other than dev/test — com.tenderpulse.auth.InsecureDefaultSecretGuard refuses to start on the
  # checked-in default tenderpulse.auth.token-secret unless "dev" or "test" is active.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tenderpulse}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:tenderpulse}
    password: ${DB_PASSWORD:tenderpulse}
  # TP-061 (#61): Flyway now owns schema creation/evolution (versioned scripts under
  # src/main/resources/db/migration) instead of Hibernate's ddl-auto: update silently managing
  # it. ddl-auto is now "validate" — Hibernate checks the entity mappings against whatever
  # Flyway has already migrated and fails loudly on a mismatch, rather than auto-correcting.
  #
  # baseline-on-migrate + baseline-version=8: every table in V1-V8 already exists (with data) on
  # any real deployment that predates this change, created by the old ddl-auto: update mechanism.
  # Without this, Flyway would try to run "CREATE TABLE tenders (...)" etc. against a database
  # where "tenders" already exists and fail outright. baseline-on-migrate makes Flyway, on first
  # run against a schema that has no flyway_schema_history table yet, insert a baseline marker at
  # baseline-version (8 — the last migration this baseline captures) instead of executing V1-V8,
  # then proceed with any migration after V8. Verified empirically against a real, populated
  # Postgres container (pre-existing rows survived, no errors, no re-run of V1-V8) — see PR
  # evidence for #61. A genuinely fresh/empty database has no schema history table either, but
  # baseline-on-migrate only takes effect when the target schema is non-empty; Flyway detects an
  # empty schema and runs the full V1-V8 migrate path normally (see PR evidence: fresh-boot test).
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 8
    baseline-description: "Baseline capturing schema created by Hibernate ddl-auto: update prior to Flyway (#61)"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  port: 8080

logging:
  level:
    com.tenderpulse: INFO

tenderpulse:
  aggregation:
    scheduled-enabled: false
    scheduled-initial-delay-ms: 0
    scheduled-interval-ms: 10800000  # 3 hours
  # TP-013: Free-tier daily digest job (com.tenderpulse.notification.DigestService), disabled by
  # default same as the aggregation job above — enable explicitly in a real deployment.
  digest:
    scheduled-enabled: false
    scheduled-initial-delay-ms: 0
    scheduled-interval-ms: 86400000  # 24 hours
  # TP-056: deadline-reminder job (com.tenderpulse.notification.ReminderService), disabled by
  # default same as the aggregation/digest jobs above — enable explicitly in a real deployment.
  # window-days: how close a tender's deadline must be (from now) to trigger a reminder for
  # subscribers already notified of that tender's original match.
  reminder:
    scheduled-enabled: false
    scheduled-initial-delay-ms: 0
    scheduled-interval-ms: 86400000  # 24 hours
    window-days: 3
  # TP-044: shared admin-key secret guarding every /api/v1/admin/** route (see
  # com.tenderpulse.auth.AdminKeyAuthFilter / SecurityConfig) — loaded from an env var only, never
  # committed. No fallback value on purpose: an unset TENDERPULSE_ADMIN_KEY leaves this blank, and
  # AdminKeyAuthFilter always rejects a blank configured key, so the admin API fails closed rather
  # than booting with a guessable/known default.
  admin:
    key: ${TENDERPULSE_ADMIN_KEY:}
  auth:
    # TP-038: HMAC key signing the stateless bearer access token issued after magic-link verify.
    # MUST be overridden (TENDERPULSE_AUTH_SECRET) in any real deployment; the fallback below is
    # only safe for local dev/test — com.tenderpulse.auth.InsecureDefaultSecretGuard logs loudly
    # any time it's in effect, and refuses to start the app entirely unless spring.profiles.active
    # is "dev" or "test" (see the `spring.profiles` block above).
    token-secret: ${TENDERPULSE_AUTH_SECRET:dev-only-insecure-secret-change-me-before-deploying-32b}
    # Magic-link token: single-use, expires 24h after it's issued (see issue #39 assumptions).
    magic-link-ttl-ms: 86400000
    # Bearer access token returned by /verify: also 24h, no refresh flow (out of scope for TP-038).
    access-token-ttl-ms: 86400000
    verify-base-url: ${TENDERPULSE_VERIFY_BASE_URL:http://localhost:8080/api/v1/auth/verify}
  # TP-057: base URL for the per-subscriber unsubscribe link embedded in every outbound email —
  # see com.tenderpulse.auth.UnsubscribeService / com.tenderpulse.notification.EmailNotificationSender.
  unsubscribe:
    base-url: ${TENDERPULSE_UNSUBSCRIBE_BASE_URL:http://localhost:8080/api/v1/unsubscribe}
  # TP-034: CORS for the marketing site's signup flow (com.tenderpulse.auth.WebsiteCorsConfig).
  # Comma-separated list of allowed origins, e.g. "https://tenderpulse.co,http://localhost:4321"
  # (4321 is Astro's default `npm run dev` port). Empty by default (no origin whitelisted) so
  # cross-origin signup fails closed until this is explicitly configured for a real deployment.
  website:
    allowed-origins: ${WEBSITE_ALLOWED_ORIGINS:}

# TP-042/TP-127: PayPal Client ID/Secret/Plan IDs are credentials — loaded from env vars only,
# never committed. Empty defaults let the app boot without them (in dev/test profiles only — see
# com.tenderpulse.paypal.PayPalPlanConfigGuard, which refuses to start in any other profile if
# either plan id is blank); POST /api/v1/subscribers/pro and
# POST /api/v1/billing/paypal/subscriptions/confirm will fail verification (as
# PayPalApiException/SubscriptionVerificationException) until they're set. See apps/api/.env.example.
#
# TP-127 (issue #127): the single `plan-id` (Pro-only) is replaced by `plans.pro` / `plans.max`
# per tenderpulse/docs/specs/subscription-lifecycle-paypal.md §9.1 — both Pro and Max now go
# through the same PayPal client/config, distinguished by which configured plan id a confirmed
# subscription's own plan_id matches.
paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  # ISO 4217 currency code shown in GET /api/v1/billing/public-config (display/bootstrap only —
  # see com.tenderpulse.billing.BillingService).
  currency: USD
  plans:
    pro: ${PAYPAL_PRO_PLAN_ID:}
    max: ${PAYPAL_MAX_PLAN_ID:}
  # Display-only monthly prices (spec §3/§8.4/§8.5) surfaced by GET /api/v1/billing/public-config.
  # Never used for entitlement decisions — POST /api/v1/billing/paypal/subscriptions/confirm only
  # ever trusts the plan id PayPal itself returns for a fetched subscription, never a price.
  amounts:
    pro: "5.00"
    max: "30.00"
